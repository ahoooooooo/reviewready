# yaml-language-server: $schema=./reviewready.schema.json
# This repository uses an explicit automation policy. A visible checkbox cannot
# authenticate human identity or responsibility, so human_attestation is omitted.
version: 1
rules:
  - id: runtime-change
    description: Runtime, test, fixture, policy, and toolchain changes need test evidence.
    when:
      paths:
        any:
          - "src/**"
          - "test/**"
          - "fixtures/**"
          - ".reviewready.yml"
          - "reviewready*.schema.json"
          - "tsconfig*.json"
          - "eslint.config.js"
          - "vitest.config.ts"
          - ".gitattributes"
    require:
      - type: pr_body_section
        heading: Testing
      - type: check
        name: check
        conclusions: [success]

  - id: trust-boundary-change
    description: Workflow, Action, package, release, security, and documentation changes need risk evidence.
    when:
      paths:
        any:
          - ".github/**"
          - "action.yml"
          - "dist/**"
          - "package.json"
          - "package-lock.json"
          - "scripts/**"
          - "README.md"
          - "CHANGELOG.md"
          - "AGENTS.md"
          - "CODE_OF_CONDUCT.md"
          - ".codex/**"
          - "CONTRIBUTING.md"
          - "GOVERNANCE.md"
          - "MAINTAINERS.md"
          - "ROADMAP.md"
          - "SECURITY.md"
          - "SUPPORT.md"
          - "docs/**"
    require:
      - type: pr_body_section
        heading: Risk
      - type: check
        name: check
        conclusions: [success]

  - id: coverage-catch-all
    description: Every ordinary repository path must enter at least one self-policy rule.
    when:
      paths:
        any: ["**"]
    require:
      - type: check
        name: check
        conclusions: [success]
