name: release preflight

on:
  pull_request:
    paths:
      - ".github/workflows/release-preflight.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "reviewready*.schema.json"
      - "dist/action/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run the complete quality gate
        run: npm run check

      - name: Audit the exact tarball and clean-room CLI
        run: npm run release:preflight

      - name: Verify every committed Action bundle artifact
        run: |
          bundle_status="$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- dist/action)"
          if [ -n "$bundle_status" ]; then
            printf '%s\n' "$bundle_status"
            exit 1
          fi
