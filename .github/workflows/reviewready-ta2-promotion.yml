name: ReviewReady TA-2 trusted promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: read

concurrency:
  group: reviewready-ta2-promotion-main
  cancel-in-progress: true

jobs:
  promotion:
    if: ${{ github.repository == 'ahoooooooo/reviewready' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile trusted source without package scripts
        run: node node_modules/typescript/bin/tsc -p tsconfig.build.json --outDir dist

      - name: Collect and replay bounded TA-2 evidence in runner temp only
        run: node scripts/ta2-promotion.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
