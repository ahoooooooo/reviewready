name: ReviewReady trusted enforcement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate pull-request evidence from the trusted base workflow
        uses: ahoooooooo/reviewready@4e31bca93116e0de737d6792fd32a8a5211fdbf5 # v1.0.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          policy-path: .reviewready.yml
