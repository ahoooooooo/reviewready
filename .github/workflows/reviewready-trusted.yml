name: ReviewReady trusted enforcement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate pull-request evidence from the trusted base workflow
        uses: ahoooooooo/reviewready@f21ed2e94efedb01f73e518c39765cef72c58e1c # v1.0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          policy-path: .reviewready.yml
