name: ReviewReady trusted enforcement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  issues: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate pull-request evidence from the trusted base workflow
        uses: ahoooooooo/reviewready@e67b1b248767b81d8e79f2b600168a4433b80ecf # v1.0.9 hotfix candidate
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          policy-path: .reviewready.yml
